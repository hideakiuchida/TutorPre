name: CI

# No despliega nada: es la puerta que dice si el commit está sano. El CD (cd.yml)
# solo arranca cuando este workflow termina en verde sobre un push a main.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar
        run: dotnet restore

      - name: Compilar
        run: dotnet build --no-restore --configuration Release

      # Las pruebas corren sobre SQLite en memoria: no necesitan PostgreSQL ni red.
      - name: Probar
        run: dotnet test --no-build --configuration Release --logger "trx;LogFileName=pruebas.trx"

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar
        run: npm ci

      # Compila igual que Vercel: si falla set-env.mjs o se pasa un presupuesto de
      # tamaño, se ve aquí y no en un despliegue.
      - name: Compilar como en producción
        env:
          API_URL: https://api.example.com/api
        run: npm run build:deploy

  imagen:
    name: Imagen Docker de la API
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # No se publica: Railway construye la suya con este Dockerfile. Existe para que un
      # error del Dockerfile aparezca en el commit que lo causó y no en un despliegue.
      - name: Construir la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
